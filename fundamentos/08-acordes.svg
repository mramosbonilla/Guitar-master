<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330"><rect width="760" height="330" rx="20" fill="#0b1933"/><style>text{font-family:Arial,sans-serif;fill:#e8f2ff} .sub{fill:#9fc4ed;font-size:16px}.ttl{font-size:22px;font-weight:bold}.ln{stroke:#d6ac73;stroke-width:3;fill:none}.wood{fill:#b97b46;stroke:#e7b67b;stroke-width:3}.line{stroke:#b5d9fa;stroke-width:2}.blue{fill:#388be5}.green{fill:#35c48b}</style><text x="24" y="35" class="ttl">Construcción de un acorde mayor: DO–MI–SOL</text><circle cx="130" cy="157" r="65" fill="#358de9"/><text x="130" y="161" text-anchor="middle" font-size="32" font-weight="bold" fill="#0b1933">DO</text><text x="130" y="251" text-anchor="middle" font-size="19">Fundamental</text><circle cx="375" cy="157" r="65" fill="#32b986"/><text x="375" y="161" text-anchor="middle" font-size="32" font-weight="bold" fill="#0b1933">MI</text><text x="375" y="251" text-anchor="middle" font-size="19">Tercera mayor</text><circle cx="620" cy="157" r="65" fill="#d5a355"/><text x="620" y="161" text-anchor="middle" font-size="32" font-weight="bold" fill="#0b1933">SOL</text><text x="620" y="251" text-anchor="middle" font-size="19">Quinta justa</text><text x="24" y="310" class="sub">Cambiar la tercera modifica el carácter mayor o menor</text></svg>
